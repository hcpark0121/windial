<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Windial</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<main>
  <h1 data-i18n="optTitle"></h1>

  <section>
    <h2 data-i18n="optDensity"></h2>
    <label class="choice"><input type="radio" name="density" value="compact"><span><b data-i18n="densityCompact"></b></span></label>
    <label class="choice"><input type="radio" name="density" value="normal"><span><b data-i18n="densityNormal"></b></span></label>
    <label class="choice"><input type="radio" name="density" value="large"><span><b data-i18n="densityLarge"></b></span></label>
  </section>

  <section>
    <h2 data-i18n="optNames"></h2>
    <p class="help" data-i18n="optNamesHelp"></p>
    <ul class="names" id="names"></ul>
    <p class="help" id="namesEmpty" data-i18n="optNamesEmpty" hidden></p>
  </section>

  <section>
    <h2 data-i18n="optShortcut"></h2>
    <div class="shortcut">
      <span class="k" id="shortcut"></span>
      <button type="button" id="shortcutChange" data-i18n="optShortcutChange"></button>
    </div>
    <p class="help" id="shortcutHelp"></p>
  </section>

  <p class="privacy" data-i18n="optPrivacy"></p>
  <p class="support" id="support" hidden><a id="supportLink" target="_blank" rel="noopener"></a></p>
  <p class="support" id="rate"><a id="rateLink" target="_blank" rel="noopener"></a></p>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden data-i18n="saved"></div>
</main>
<script type="module" src="mock.js"></script>
<script type="module" src="options.js"></script>
</body>
</html>
